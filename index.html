<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inkubator-Register</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
/* Layout: one working column. Header, then the incubators drawn as cabinets with
   numbered shelves; each culture is a tile on its shelf. Table and log are secondary views. */
:root {
  --bg: #eaeef1;
  --surface: #ffffff;
  --surface-2: #f4f6f8;
  --line: #d3dae0;
  --steel: #b9c4cc;
  --fg: #15222b;
  --muted: #566571;
  --accent: #0b6477;
  --accent-fg: #ffffff;
  --accent-soft: #d9ecf0;
  --ok: #1c7448;
  --ok-soft: #dcf1e5;
  --warn: #8f5a00;
  --warn-soft: #fbecc9;
  --crit: #b0271f;
  --crit-soft: #fbe0dd;
  --display-bg: #0e1c24;
  --display-fg: #86e6c8;
  --backdrop: rgba(14, 28, 36, .45);
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-display: "IBM Plex Sans Condensed", "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e161b; --surface: #162128; --surface-2: #1c2931; --line: #2b3a44; --steel: #3d4f5b;
    --fg: #e3eaee; --muted: #94a4af; --accent: #55bdd0; --accent-fg: #05222a; --accent-soft: #13343f;
    --ok: #62cf98; --ok-soft: #133424; --warn: #e8b755; --warn-soft: #3a2c0d; --crit: #f28a82; --crit-soft: #431b18;
    --display-bg: #091116; --display-fg: #86e6c8; --backdrop: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e161b; --surface: #162128; --surface-2: #1c2931; --line: #2b3a44; --steel: #3d4f5b;
  --fg: #e3eaee; --muted: #94a4af; --accent: #55bdd0; --accent-fg: #05222a; --accent-soft: #13343f;
  --ok: #62cf98; --ok-soft: #133424; --warn: #e8b755; --warn-soft: #3a2c0d; --crit: #f28a82; --crit-soft: #431b18;
  --display-bg: #091116; --display-fg: #86e6c8; --backdrop: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.45 var(--font-body);
}
.page {
  max-width: 1120px;
  margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font: 600 26px/1.1 var(--font-display); letter-spacing: .01em; }
.brand p { color: var(--muted); font-size: 13px; }
.top-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-weight: 500; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

.demo-note {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
  padding: 8px 12px; border: 1px dashed var(--steel); border-radius: var(--radius);
  font-size: 13px; color: var(--muted);
}
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* Controls */
select, input[type="text"], input[type="search"], input[type="number"], input[type="date"], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 7px 10px; min-width: 0; width: 100%;
}
.who select { width: auto; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
  padding: 7px 14px; cursor: pointer; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.danger { color: var(--crit); }
.btn.danger:hover { border-color: var(--crit); }

/* Tabs + summary */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button {
  border: 0; background: none; padding: 9px 14px; cursor: pointer; font-weight: 500; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

.summary { display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 14px; }
.summary .stat { display: flex; align-items: baseline; gap: 6px; }
.summary .stat b { font: 500 20px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.summary .stat.crit b { color: var(--crit); }
.summary .stat.warn b { color: var(--warn); }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.toolbar .search { flex: 1 1 220px; min-width: 0; }
.toolbar .status { flex: 0 1 170px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.toolbar .spacer { flex: 1 1 0; }

/* Cabinets */
#body { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.cabinet { border: 2px solid var(--steel); border-radius: 10px; background: var(--surface); overflow: hidden; }
.cab-head {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  padding: 10px 14px; background: var(--surface-2); border-bottom: 2px solid var(--steel);
}
.cab-head h2 { font: 600 19px/1.2 var(--font-display); }
.cab-head .room { color: var(--muted); font-size: 13px; margin-left: 8px; font-family: var(--font-body); font-weight: 400; }
.display {
  display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 5px 12px; border-radius: 4px;
  background: var(--display-bg); color: var(--display-fg);
  font: 500 13px/1.4 var(--font-mono); font-variant-numeric: tabular-nums;
}
.shelves { list-style: none; margin: 0; padding: 0; }
.shelf { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 3px double var(--steel); }
.shelf:last-child { border-bottom: 0; }
.shelf-label {
  flex: none; width: 64px; padding-top: 6px;
  font: 500 11px/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
}
.shelf-items { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
@media (max-width: 560px) {
  .shelf { flex-direction: column; gap: 6px; }
  .shelf-label { width: auto; padding-top: 0; }
}

.tile {
  display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer; min-width: 0;
  padding: 8px 10px; border: 1px solid var(--line); border-left: 4px solid var(--steel); border-radius: 4px;
  background: var(--surface-2);
}
.tile:hover { border-color: var(--accent); border-left-color: var(--accent); }
.tile.s-crit { border-left-color: var(--crit); }
.tile.s-warn { border-left-color: var(--warn); }
.tile.s-ok { border-left-color: var(--ok); }
.tile.dim { opacity: .3; }
.tile-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.tile .cl { font-weight: 600; overflow-wrap: anywhere; }
.tile-meta { font-size: 12px; color: var(--muted); }
.tile-foot { display: flex; align-items: center; gap: 6px; font-size: 12.5px; flex-wrap: wrap; }
.add-slot {
  border: 1px dashed var(--steel); background: transparent; border-radius: 4px; cursor: pointer;
  color: var(--muted); font-size: 13px; min-height: 44px; padding: 8px 10px;
}
.add-slot:hover { border-color: var(--accent); color: var(--accent); }

.avatar {
  flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  font: 600 10px/1 var(--font-body); color: #fff; letter-spacing: .02em;
}
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.none, .pill.off { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.bsl { background: var(--accent-soft); color: var(--accent); }

/* Table */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.owner-cell { display: inline-flex; align-items: center; gap: 6px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

/* Log */
.log { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.log li { display: flex; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.log li:last-child { border-bottom: 0; }
.log .when { flex: none; width: 128px; font: 12px/1.7 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.log .what { min-width: 0; overflow-wrap: anywhere; }
.log .note { color: var(--muted); font-size: 13.5px; }
@media (max-width: 560px) {
  .log li { flex-wrap: wrap; gap: 2px 8px; }
  .log .when { width: 100%; }
}

/* Dialog */
dialog {
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg);
  padding: 0; width: min(680px, calc(100vw - 24px)); max-height: calc(100vh - 32px);
}
dialog::backdrop { background: var(--backdrop); }
.dlg { display: flex; flex-direction: column; gap: 16px; padding: 18px 20px 20px; }
.dlg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dlg-head h2 { font: 600 22px/1.2 var(--font-display); text-wrap: balance; }
.dlg-head .id { font-size: 13px; color: var(--muted); }
.x { border: 0; background: none; cursor: pointer; font-size: 22px; line-height: 1; padding: 2px 6px; color: var(--muted); border-radius: 4px; }
.x:hover { color: var(--fg); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px 20px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.facts .wide { grid-column: 1 / -1; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.sect { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.dlg .log { border-color: var(--line); }
.dlg .log .when { width: 118px; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.form-grid .wide { grid-column: 1 / -1; }
@media (max-width: 520px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12.5px; color: var(--muted); }
.field textarea { min-height: 64px; resize: vertical; }
.pair { display: flex; gap: 8px; }
.pair > * { flex: 1; min-width: 0; }
.dlg-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px;
  max-width: calc(100vw - 32px); z-index: 50;
}
</style>
</head>

<div class="page">
  <header class="top">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
        <rect x="3" y="3" width="32" height="32" rx="5" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
        <line x1="8" y1="14" x2="30" y2="14" stroke="var(--steel)" stroke-width="2"/>
        <line x1="8" y1="24" x2="30" y2="24" stroke="var(--steel)" stroke-width="2"/>
        <rect x="10" y="8" width="8" height="5" rx="1" fill="var(--accent)"/>
        <rect x="20" y="18" width="8" height="5" rx="1" fill="var(--accent)"/>
        <rect x="10" y="28" width="6" height="4" rx="1" fill="var(--accent)"/>
      </svg>
      <div>
        <h1 id="app-title"></h1>
        <p id="app-sub"></p>
      </div>
    </div>
    <div class="top-controls">
      <label class="who"><span id="who-label"></span>
        <select id="user-select"></select>
      </label>
      <div class="seg" role="group" id="lang-seg">
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <p class="demo-note"><span id="demo-text"></span> <button type="button" class="link" data-act="reset" id="reset-btn"></button></p>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section class="summary" id="summary" aria-live="polite"></section>

  <div class="toolbar">
    <input type="search" class="search" id="q" autocomplete="off">
    <select class="status" id="status-filter"></select>
    <label class="check"><input type="checkbox" id="mine"><span id="mine-label"></span></label>
    <span class="spacer"></span>
    <button type="button" class="btn primary" data-act="new" id="new-btn"></button>
  </div>

  <main id="body"></main>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

/* ---------- Helpers ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}
function pad(n, w) { return String(n).padStart(w || 2, '0'); }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return iso(new Date()); }
function parseDate(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(s, n) { var d = parseDate(s); d.setDate(d.getDate() + n); return iso(d); }
function diffDays(a, b) { return Math.round((parseDate(a) - parseDate(b)) / 864e5); }
function locale() { return ui.lang === 'de' ? 'de-DE' : 'en-GB'; }
function fmtDate(s) { return s ? parseDate(s).toLocaleDateString(locale(), { day: '2-digit', month: '2-digit', year: 'numeric' }) : '–'; }
function fmtTs(ts) { return new Date(ts).toLocaleString(locale(), { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }); }
function fmtNum(n) { return n.toLocaleString(locale(), { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
var uidN = 0;
function uid() { uidN += 1; return 'e' + Date.now().toString(36) + uidN.toString(36) + Math.floor(Math.random() * 1e4).toString(36); }
function t(key) {
  var s = I18N[ui.lang][key];
  if (s == null) s = I18N.de[key] != null ? I18N.de[key] : key;
  for (var i = 1; i < arguments.length; i++) s = s.replace('{' + (i - 1) + '}', arguments[i]);
  return s;
}
function userById(id) { return USERS.find(function (u) { return u.id === id; }) || { id: id, name: '?', hue: 0 }; }
function incById(id) { return INCUBATORS.find(function (i) { return i.id === id; }) || INCUBATORS[0]; }

var prefs = read(LS_PREFS) || {};
var ui = {
  lang: prefs.lang === 'de' || prefs.lang === 'en' ? prefs.lang : ((navigator.language || 'de').toLowerCase().indexOf('de') === 0 ? 'de' : 'en'),
  user: USERS.some(function (u) { return u.id === prefs.user; }) ? prefs.user : 'u1',
  view: 'inc', q: '', mine: false, status: 'active'
};
var db = read(LS_DATA);
if (!db || !Array.isArray(db.cultures) || !Array.isArray(db.events)) { db = seed(ui.lang); }

function saveDb() { store(LS_DATA, db); }
function savePrefs() { store(LS_PREFS, { lang: ui.lang, user: ui.user }); }
function cultureById(id) { return db.cultures.find(function (c) { return c.id === id; }); }
function logEvent(cultureId, type, extra) {
  db.events.push(Object.assign({ id: uid(), cultureId: cultureId, type: type, user: ui.user, ts: Date.now() }, extra || {}));
}
function nextId() {
  var max = db.cultures.reduce(function (m, c) { var v = parseInt(c.id.replace(/\D/g, ''), 10); return v > m ? v : m; }, 100);
  return 'K-' + pad(max + 1, 4);
}

function dueInfo(c) {
  if (c.status !== 'active') return { cls: 'off', label: t('st_removed'), rank: 9999 };
  if (!c.nextDue || c.nextType === 'none') return { cls: 'none', label: t('no_action'), rank: 9998 };
  var d = diffDays(c.nextDue, today());
  if (d < 0) return { cls: 'crit', label: t('overdue', -d), rank: d };
  if (d === 0) return { cls: 'warn', label: t('due_today'), rank: 0 };
  if (d === 1) return { cls: 'ok', label: t('due_tomorrow'), rank: 1 };
  return { cls: 'ok', label: t('due_in', d), rank: d };
}
function matches(c) {
  if (ui.mine && c.owner !== ui.user) return false;
  var q = ui.q.trim().toLowerCase();
  if (!q) return true;
  var hay = [c.id, c.cellLine, c.project, c.medium, c.supplements, c.vessel, c.notes, userById(c.owner).name].join(' ').toLowerCase();
  return hay.indexOf(q) !== -1;
}
function byDue(a, b) { return dueInfo(a).rank - dueInfo(b).rank || a.id.localeCompare(b.id); }

function renderSummary() {
  var active = db.cultures.filter(function (c) { return c.status === 'active'; });
  var todayN = 0, over = 0, mine = 0;
  active.forEach(function (c) {
    var d = dueInfo(c);
    if (d.cls === 'warn') todayN += 1;
    if (d.cls === 'crit') over += 1;
    if (c.owner === ui.user) mine += 1;
  });
  $('summary').innerHTML =
    '<span class="stat"><b>' + active.length + '</b> ' + t('sum_active') + '</span>' +
    '<span class="stat' + (todayN ? ' warn' : '') + '"><b>' + todayN + '</b> ' + t('sum_today') + '</span>' +
    '<span class="stat' + (over ? ' crit' : '') + '"><b>' + over + '</b> ' + t('sum_over') + '</span>' +
    '<span class="stat"><b>' + mine + '</b> ' + t('sum_mine') + '</span>';

function viewIncubators() {

        '</div></li>';

function eventText(e) {

}
function opt(value, label, selected) { return '<option value="' + esc(value) + '"' + (selected ? ' selected' : '') + '>' + esc(label) + '</option>'; }
function field(label, control, wide) { return '<label class="field' + (wide ? ' wide' : '') + '"><span>' + esc(label) + '</span>' + control + '</label>'; }
function shelfOptions(incId, selected) {
  var out = '';
  for (var s = 1; s <= incById(incId).shelves; s++) out += opt(s, t('shelf') + ' ' + s, Number(selected) === s);
  return out;
}
function nextFields(type, due) {
  return '<div class="field wide"><span>' + t('then') + '</span><div class="pair">' +
    '<select id="f-nextType" aria-label="' + t('c_next') + '">' + NEXT_TYPES.map(function (n) { return opt(n, t('next_' + n), n === type); }).join('') + '</select>' +
    '<input type="date" id="f-nextDue" aria-label="' + t('c_due') + '" value="' + esc(due || '') + '">' +
    '</div></div>';
}

function openDetail(id) {
  var c = cultureById(id);
  if (!c) return;
  var d = dueInfo(c);
  var active = c.status === 'active';
  var end = active ? today() : (c.removedAt || today());
  function fact(label, value, wide) { return '<div' + (wide ? ' class="wide"' : '') + '><dt>' + esc(label) + '</dt><dd>' + value + '</dd></div>'; }
  var events = db.events.filter(function (e) { return e.cultureId === id; }).sort(function (a, b) { return b.ts - a.ts; });
  var myco = c.mycoResult === 'open' ? t('myco_open') : t('myco_' + c.mycoResult) + (c.mycoDate ? ' · ' + fmtDate(c.mycoDate) : '');
  openDlg('<div class="dlg">' + dlgHead(c.cellLine, c.id) +
    '<div class="pills"><span class="pill ' + d.cls + '">' + esc(active && c.nextType !== 'none' && c.nextDue ? t('next_' + c.nextType) + ' · ' + d.label : d.label) + '</span>' +
    (c.bsl === 'S2' ? '<span class="pill bsl">S2</span>' : '') +
    (!active ? '<span class="pill off">' + esc(t('r_' + c.removedReason)) + '</span>' : '') + '</div>' +
    '<dl class="facts">' +
    fact(t('c_passage'), '<span class="mono">P' + esc(c.passage) + '</span>') +
    fact(t('c_vessel'), '<span class="mono">' + esc(vesselText(c)) + '</span>') +
    fact(t('c_place'), esc(placeText(c.incubator, c.shelf))) +
    fact(t('c_medium'), esc(c.medium) + (c.supplements ? '<br><span class="muted">' + esc(c.supplements) + '</span>' : '')) +
    fact(t('c_seeded'), '<span class="mono">' + fmtDate(c.seeded) + '</span> <span class="muted">(' + t('days', diffDays(end, c.seeded)) + ')</span>') +
    fact(t('c_conf'), c.confluence != null && c.confluence !== '' ? '<span class="mono">' + esc(c.confluence) + ' %</span>' : '–') +
    fact(t('c_owner'), '<span class="owner-cell">' + avatar(c.owner) + esc(userById(c.owner).name) + '</span>') +
    fact(t('c_project'), esc(c.project) || '–') +
    fact(t('c_myco'), esc(myco)) +
    (active ? fact(t('c_due'), c.nextDue && c.nextType !== 'none' ? '<span class="mono">' + fmtDate(c.nextDue) + '</span>' : '–')
            : fact(t('removed_on'), '<span class="mono">' + fmtDate(c.removedAt) + '</span>')) +
    (c.notes ? fact(t('c_notes'), esc(c.notes), true) : '') +
    '</dl>' +
    (active ? '<div class="actions">' +
      '<button type="button" class="btn primary" data-do="medium" data-id="' + esc(id) + '">' + t('a_medium') + '</button>' +
      '<button type="button" class="btn primary" data-do="passage" data-id="' + esc(id) + '">' + t('a_passage') + '</button>' +
      '<button type="button" class="btn" data-do="check" data-id="' + esc(id) + '">' + t('a_check') + '</button>' +
      '<button type="button" class="btn" data-do="note" data-id="' + esc(id) + '">' + t('a_note') + '</button>' +
      '<button type="button" class="btn" data-do="edit" data-id="' + esc(id) + '">' + t('a_edit') + '</button>' +
      '<button type="button" class="btn danger" data-do="remove" data-id="' + esc(id) + '">' + t('a_remove') + '</button>' +
      '</div>' : '') +
    '<div class="sect">' + t('history') + '</div>' +
    '<ol class="log">' + events.map(function (e) { return logItem(e, false); }).join('') + '</ol>' +
    '</div>');
}

function openCultureForm(id, preset) {
  var c = id ? cultureById(id) : null;
  var v = c || Object.assign({
    cellLine: '', passage: 1, vessel: 'T75', count: 1, medium: '', supplements: '', seeded: today(),
    incubator: 'i1', shelf: 1, owner: ui.user, project: '', nextType: 'medium', nextDue: addDays(today(), 2),
    mycoDate: '', mycoResult: 'open', bsl: 'S1', notes: ''
  }, preset || {});
  openDlg('<form class="dlg" id="culture-form" data-id="' + esc(id || '') + '">' + dlgHead(c ? t('form_edit') : t('form_new'), c ? c.id : '') +
    '<div class="form-grid">' +
    field(t('c_line') + ' *', '<input type="text" id="f-cellLine" list="dl-lines" required maxlength="60" value="' + esc(v.cellLine) + '">') +
    field(t('c_passage'), '<input type="number" id="f-passage" min="0" max="999" step="1" required value="' + esc(v.passage) + '">') +
    field(t('c_vessel'), '<select id="f-vessel">' + VESSELS.map(function (x) { return opt(x, x, x === v.vessel); }).join('') + '</select>') +
    field(t('c_count'), '<input type="number" id="f-count" min="1" max="99" step="1" required value="' + esc(v.count) + '">') +
    field(t('c_medium'), '<input type="text" id="f-medium" list="dl-media" maxlength="60" value="' + esc(v.medium) + '">') +
    field(t('c_supp'), '<input type="text" id="f-supplements" maxlength="120" placeholder="' + esc(t('ph_supp')) + '" value="' + esc(v.supplements) + '">') +
    field(t('incubator'), '<select id="f-incubator">' + INCUBATORS.map(function (i) { return opt(i.id, incName(i), i.id === v.incubator); }).join('') + '</select>') +
    field(t('shelf'), '<select id="f-shelf">' + shelfOptions(v.incubator, v.shelf) + '</select>') +
    field(t('c_seeded'), '<input type="date" id="f-seeded" required value="' + esc(v.seeded) + '">') +
    field(t('c_owner'), '<select id="f-owner">' + USERS.map(function (u) { return opt(u.id, u.name, u.id === v.owner); }).join('') + '</select>') +
    field(t('c_project'), '<input type="text" id="f-project" maxlength="80" value="' + esc(v.project) + '">') +
    field(t('c_bsl'), '<select id="f-bsl">' + opt('S1', 'S1', v.bsl === 'S1') + opt('S2', 'S2', v.bsl === 'S2') + '</select>') +
    field(t('c_next'), '<select id="f-nextType">' + NEXT_TYPES.map(function (n) { return opt(n, t('next_' + n), n === v.nextType); }).join('') + '</select>') +
    field(t('c_due'), '<input type="date" id="f-nextDue" value="' + esc(v.nextDue) + '">') +
    field(t('c_myco_res'), '<select id="f-mycoResult">' + ['open', 'neg', 'pos'].map(function (m) { return opt(m, t('myco_' + m), m === v.mycoResult); }).join('') + '</select>') +
    field(t('c_myco_date'), '<input type="date" id="f-mycoDate" value="' + esc(v.mycoDate) + '">') +
    field(t('c_notes'), '<textarea id="f-notes" maxlength="500">' + esc(v.notes) + '</textarea>', true) +
    '</div>' +
    '<datalist id="dl-lines">' + CELL_LINES.map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>' +
    '<datalist id="dl-media">' + MEDIA.map(function (x) { return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>' +
    '<div class="dlg-foot"><button type="button" class="btn" data-act="' + (c ? 'back' : 'close') + '" data-id="' + esc(id || '') + '">' + t('cancel') + '</button>' +
    '<button type="submit" class="btn primary">' + t('save') + '</button></div></form>');
}

function openAction(id, type) {
  var c = cultureById(id);
  if (!c) return;
  var body = '';
  var nextType = c.nextType, nextDue = c.nextDue;
  if (type === 'medium') { nextType = 'medium'; nextDue = addDays(today(), 2); }
  if (type === 'passage') {
    nextType = 'medium'; nextDue = addDays(today(), 2);
    body += field(t('new_passage'), '<input type="number" id="f-passage" min="0" max="999" step="1" required value="' + (Number(c.passage) + 1) + '">') +
            field(t('ratio'), '<input type="text" id="f-ratio" maxlength="20" placeholder="' + esc(t('ph_ratio')) + '">');
  }
  if (type === 'medium' || type === 'check') {
    body += field(t('conf_pct'), '<input type="number" id="f-confluence" min="0" max="100" step="5" value="' + (c.confluence != null ? esc(c.confluence) : '') + '">', true);
  }
  body += field(t('note'), '<textarea id="f-note" maxlength="300"' + (type === 'note' ? ' required' : '') + '></textarea>', true);
  if (type !== 'note') body += nextFields(nextType, nextDue);
  openDlg('<form class="dlg" id="action-form" data-id="' + esc(id) + '" data-type="' + type + '">' + dlgHead(t('act_' + type), c.cellLine + ' · ' + c.id) +
    '<div class="form-grid">' + body + '</div>' +
    '<div class="dlg-foot"><button type="button" class="btn" data-act="back" data-id="' + esc(id) + '">' + t('cancel') + '</button>' +
    '<button type="submit" class="btn primary">' + t('log_it') + '</button></div></form>');
}

function openRemove(id) {
  var c = cultureById(id);
  if (!c) return;
  openDlg('<form class="dlg" id="remove-form" data-id="' + esc(id) + '">' + dlgHead(t('remove_title'), c.cellLine + ' · ' + c.id) +
    '<div class="form-grid">' +
    field(t('reason'), '<select id="f-reason">' + REASONS.map(function (r) { return opt(r, t('r_' + r), false); }).join('') + '</select>', true) +
    field(t('note'), '<textarea id="f-note" maxlength="300"></textarea>', true) +
    '</div><div class="dlg-foot"><button type="button" class="btn" data-act="back" data-id="' + esc(id) + '">' + t('cancel') + '</button>' +
    '<button type="submit" class="btn danger">' + t('remove_do') + '</button></div></form>');
}

function openReset() {
  openDlg('<div class="dlg">' + dlgHead(t('reset_title')) + '<p>' + t('reset_text') + '</p>' +
    '<div class="dlg-foot"><button type="button" class="btn" data-act="close">' + t('cancel') + '</button>' +
    '<button type="button" class="btn danger" data-act="reset-confirm">' + t('reset_do') + '</button></div></div>');
}

var toastTimer = null;
function toast(msg) {
  var el = $('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; }, 2200);
}

/* ---------- Form handling ---------- */
function val(id) { var el = $(id); return el ? el.value.trim() : ''; }
function numOrNull(id) { var v = val(id); return v === '' ? null : Number(v); }

function submitCulture(form) {
  var id = form.dataset.id;
  var data = {
    cellLine: val('f-cellLine'), passage: Number(val('f-passage')) || 0, vessel: val('f-vessel'), count: Number(val('f-count')) || 1,
    medium: val('f-medium'), supplements: val('f-supplements'), seeded: val('f-seeded') || today(),
    incubator: val('f-incubator'), shelf: Number(val('f-shelf')) || 1, owner: val('f-owner'), project: val('f-project'),
    nextType: val('f-nextType'), nextDue: val('f-nextDue'), mycoResult: val('f-mycoResult'), mycoDate: val('f-mycoDate'),
    bsl: val('f-bsl'), notes: val('f-notes')
  };
  if (!data.cellLine) return;
  if (data.nextType === 'none') data.nextDue = '';
  if (id) {
    var c = cultureById(id);
    var moved = c.incubator !== data.incubator || Number(c.shelf) !== data.shelf;
    var from = { incubator: c.incubator, shelf: c.shelf };
    Object.assign(c, data);
    if (moved) logEvent(id, 'moved', { from: from, to: { incubator: data.incubator, shelf: data.shelf } });
    else logEvent(id, 'edited');
  } else {
    id = nextId();
    db.cultures.push(Object.assign({ id: id, confluence: null, status: 'active', removedAt: '', removedReason: '' }, data));
    logEvent(id, 'seeded', { passage: data.passage });
  }
  saveDb(); renderBody(); openDetail(id); toast(t('t_saved'));
}

function submitAction(form) {
  var id = form.dataset.id, type = form.dataset.type;
  var c = cultureById(id);
  if (!c) return;
  var extra = { note: val('f-note') };
  if (type === 'note' && !extra.note) return;
  if (type === 'passage') {
    c.passage = Number(val('f-passage')) || Number(c.passage) + 1;
    c.seeded = today();
    c.confluence = null;
    extra.passage = c.passage;
    extra.ratio = val('f-ratio');
  }
  if (type === 'medium' || type === 'check') {
    var conf = numOrNull('f-confluence');
    if (conf != null) { c.confluence = conf; extra.confluence = conf; }
  }
  if (type !== 'note') {
    c.nextType = val('f-nextType') || 'none';
    c.nextDue = c.nextType === 'none' ? '' : val('f-nextDue');
  }
  logEvent(id, type, extra);
  saveDb(); renderBody(); openDetail(id); toast(t('t_logged'));
}

function submitRemove(form) {
  var id = form.dataset.id;
  var c = cultureById(id);
  if (!c) return;
  c.status = 'removed';
  c.removedAt = today();
  c.removedReason = val('f-reason') || 'discarded';
  logEvent(id, 'removed', { reason: c.removedReason, note: val('f-note') });
  saveDb(); renderBody(); closeDlg(); toast(t('t_removed'));
}

/* ---------- Events ---------- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-open],[data-act],[data-do],[data-view],[data-lang]');
  if (!el) {
    if (ev.target === dlg) closeDlg();   // click on the backdrop
    return;
  }
  if (el.dataset.open) { openDetail(el.dataset.open); return; }
  if (el.dataset.view) { ui.view = el.dataset.view; renderShell(); return; }
  if (el.dataset.lang) { ui.lang = el.dataset.lang; savePrefs(); renderShell(); return; }
  if (el.dataset.do) {
    var id = el.dataset.id, what = el.dataset.do;
    if (what === 'edit') openCultureForm(id);
    else if (what === 'remove') openRemove(id);
    else openAction(id, what);
    return;
  }
  var act = el.dataset.act;
  if (act === 'close') closeDlg();
  else if (act === 'back') openDetail(el.dataset.id);
  else if (act === 'new') openCultureForm(null, el.dataset.inc ? { incubator: el.dataset.inc, shelf: Number(el.dataset.shelf) } : null);
  else if (act === 'reset') openReset();
  else if (act === 'reset-confirm') { db = seed(ui.lang); saveDb(); closeDlg(); renderBody(); toast(t('t_reset')); }
});

document.addEventListener('submit', function (ev) {
  ev.preventDefault();
  var form = ev.target;
  if (form.id === 'culture-form') submitCulture(form);
  else if (form.id === 'action-form') submitAction(form);
  else if (form.id === 'remove-form') submitRemove(form);
});

document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.id === 'user-select') { ui.user = el.value; savePrefs(); renderBody(); }
  else if (el.id === 'mine') { ui.mine = el.checked; renderBody(); }
  else if (el.id === 'status-filter') { ui.status = el.value; renderBody(); }
  else if (el.id === 'f-incubator' && $('f-shelf')) { $('f-shelf').innerHTML = shelfOptions(el.value, 1); }
  else if (el.id === 'f-nextType' && $('f-nextDue') && el.value !== 'none' && !$('f-nextDue').value) { $('f-nextDue').value = addDays(today(), 2); }
});

$('q').addEventListener('input', function (ev) { ui.q = ev.target.value; renderBody(); });
dlg.addEventListener('close', function () { dlg.innerHTML = ''; });

renderShell();
})();
</script>
</body>
</html>
